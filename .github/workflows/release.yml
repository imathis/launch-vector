name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Verify the tag matches the Lab version
        run: test "v$(node -p 'require("./packages/lab/package.json").version')" = "$GITHUB_REF_NAME"
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token with contents write access to imathis/homebrew-tap
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      # Trusted publishing (configured on npmjs.com) needs npm 11.5.1 or newer.
      - run: npm install --global npm@latest
      - name: Publish @launch-vector/lab
        working-directory: packages/lab
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "@launch-vector/lab@$version" version >/dev/null 2>&1; then
            echo "@launch-vector/lab@$version is already published"
          else
            npm publish --access public
          fi
