version: "0.5"

processes:
  demo:
    description: Demo application at demo.vector.localhost
    command: portless demo bun run dev:app
    working_dir: ./apps/web
    success_exit_codes: [130, 143]
    shutdown:
      signal: 2
      timeout_seconds: 10

  docs:
    description: UI documentation at ui.vector.localhost
    command: portless ui bun run dev:app
    working_dir: ./apps/docs
    success_exit_codes: [130, 143]
    shutdown:
      signal: 2
      timeout_seconds: 10

  lab:
    description: Prototype lab at lab.vector.localhost
    command: portless lab bun run dev:app
    working_dir: ./apps/lab
    success_exit_codes: [130, 143]
    shutdown:
      signal: 2
      timeout_seconds: 10
